[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pipeline --cov-report=term-missing --cov-fail-under=80"

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'"]

[project]
name = "claude-remember"
version = "0.0.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-datadir",
    "pytest-mock",
    "pytest-recording",
    "pytest-regressions",
]
